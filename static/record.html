<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>muse2 record</title>
<style>
  :root { --bg:#0e0f12; --panel:#17191e; --line:#262a31; --text:#e7e9ee; --dim:#8b92a0;
          --good:#3ecf8e; --fair:#e8c547; --bad:#ef5b5b; --rec:#ff3b3b; --accent:#7aa2ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; display:flex; flex-direction:column; gap:12px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .row { display:flex; align-items:center; gap:10px; }
  .between { justify-content:space-between; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--dim); flex:none; }
  .dot.connected { background:var(--good); } .dot.connecting,.dot.reconnecting { background:var(--fair); } .dot.disconnected { background:var(--bad); }
  .dim { color:var(--dim); font-size:12px; }
  canvas { width:100%; height:150px; display:block; }
  .chips { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:8px; }
  .chip { border-radius:8px; padding:6px; text-align:center; font-size:12px; background:#20232a; border:1px solid var(--line); }
  .chip b { display:block; font-size:13px; }
  .chip.good { border-color:var(--good); } .chip.fair { border-color:var(--fair); } .chip.noisy,.chip.hum,.chip.nocontact { border-color:var(--bad); }
  .bars { display:grid; grid-template-columns:60px 1fr; gap:4px 8px; align-items:center; font-size:12px; margin-top:8px; }
  .bar { height:6px; background:#20232a; border-radius:3px; overflow:hidden; } .bar > i { display:block; height:100%; background:var(--accent); width:0; transition:width .2s; }
  #big { width:100%; padding:18px; font-size:20px; font-weight:600; border:0; border-radius:12px; cursor:pointer; background:#2a2f38; color:var(--text); }
  #big.rec { background:var(--rec); color:white; animation:pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity:.82; } }
  input[type=text], select { width:100%; background:#0f1115; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px; font:inherit; }
  button.small { background:#2a2f38; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 12px; cursor:pointer; font:inherit; }
  label { font-size:12px; color:var(--dim); display:block; margin:8px 0 4px; }
  .midi label { display:flex; gap:6px; color:var(--text); margin:4px 0; font-size:13px; }
  #timer { font-variant-numeric:tabular-nums; font-size:26px; font-weight:600; }
  .kbd { font-size:11px; color:var(--dim); border:1px solid var(--line); border-radius:4px; padding:0 4px; }
  .ccrow { display:grid; grid-template-columns:70px 56px 1fr 64px; gap:8px; align-items:center; font-size:13px; margin:4px 0; }
  .ccrow .bar > i { background:var(--good); transition:width .08s; }
  .ccrow button.learning { background:var(--fair); color:#000; }
  #summary { white-space:pre-wrap; font:12px ui-monospace, Menlo, monospace; color:var(--dim); }
  .warn { color:var(--fair); font-size:12px; }
</style>
</head>
<body>
<main>
  <div class="panel">
    <div class="row between">
      <div class="row"><span id="dot" class="dot"></span><b id="status">starting</b></div>
      <span class="dim" id="sim"></span>
    </div>
    <div class="dim" id="detail" style="margin-top:4px"></div>
    <canvas id="trace" width="1060" height="300"></canvas>
    <div class="chips" id="chips"></div>
    <div class="bars" id="bars"></div>
  </div>

  <div class="panel">
    <div class="row between" style="margin-bottom:10px">
      <div id="timer">00:00</div>
      <div class="dim" id="recinfo">not recording</div>
    </div>
    <button id="big">Start recording</button>
    <div class="row" style="margin-top:10px">
      <input type="text" id="marktext" placeholder="marker note (optional) — e.g. 'switched to bridge'">
      <button class="small" id="markbtn">Mark</button>
    </div>
    <div class="dim" style="margin-top:6px"><span class="kbd">Space</span> start/stop &nbsp; <span class="kbd">M</span> mark (when not typing)</div>
    <div id="warns"></div>
  </div>

  <div class="panel" id="ccpanel">
    <div class="row between">
      <b>EEG → MIDI CC <span class="dim" id="ccport"></span></b>
      <label class="row" style="margin:0;color:var(--text)"><input type="checkbox" id="ccon"> send</label>
    </div>
    <div class="dim" style="margin:4px 0 8px">In Logic: click a plugin knob, press ⌘L (Learn), then hit <b>Learn</b> on a row here — only that CC moves. ⌘L again to finish.</div>
    <div id="ccrows"></div>
    <label class="row" style="margin-top:8px;color:var(--text)"><input type="checkbox" id="notes"> blink → note C3, jaw clench → note D3</label>
    <div class="warn" id="ccerr"></div>
  </div>

  <div class="panel">
    <label for="label">Session label (e.g. Logic project name)</label>
    <input type="text" id="label" placeholder="ian-chang-sketch-v2">
    <label for="audio">Audio input to capture (what Logic plays — pick BlackHole / Loopback)</label>
    <select id="audio"></select>
    <label>MIDI inputs to log</label>
    <div class="midi" id="midi"><span class="dim">none found</span></div>
  </div>

  <div class="panel">
    <div class="row between"><b>Last session</b><button class="small" id="reveal">Show in Finder</button></div>
    <div id="summary" class="dim">—</div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let recording = false, busy = false;
const COLORS = ["#7aa2ff", "#3ecf8e", "#e8c547", "#ef7bd8"];

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(body) });
  return r.json();
}

async function loadDevices() {
  const d = await api("/devices");
  const sel = $("audio");
  sel.innerHTML = "";
  const none = new Option("— don't record audio —", "");
  sel.add(none);
  for (const n of d.audio_inputs) sel.add(new Option(n, n));
  sel.value = d.audio_device || "";
  const m = $("midi");
  if (d.midi_inputs.length) {
    m.innerHTML = "";
    for (const n of d.midi_inputs) {
      const lab = document.createElement("label");
      const cb = document.createElement("input");
      cb.type = "checkbox"; cb.value = n; cb.checked = d.midi_ports.includes(n);
      lab.append(cb, document.createTextNode(n));
      m.append(lab);
    }
  }
}

function drawTrace(trace) {
  const c = $("trace"), g = c.getContext("2d");
  g.clearRect(0, 0, c.width, c.height);
  if (!trace.length) return;
  const lane = c.height / trace.length;
  trace.forEach((ch, k) => {
    const mid = lane * k + lane / 2;
    const scale = (lane / 2) / 100; // ±100 µV fills the lane
    g.strokeStyle = COLORS[k]; g.lineWidth = 2; g.beginPath();
    ch.forEach((v, i) => {
      const x = (i / (ch.length - 1)) * c.width;
      const y = mid - Math.max(-lane / 2, Math.min(lane / 2, v * scale));
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    });
    g.stroke();
  });
}

function fmt(s) { s = Math.floor(s); const m = Math.floor(s / 60); return String(m).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }

async function tick() {
  let s;
  try { s = await api("/state"); } catch { $("status").textContent = "recorder not running"; $("dot").className = "dot disconnected"; return; }
  $("status").textContent = s.status; $("dot").className = "dot " + s.status;
  $("detail").textContent = s.detail; $("sim").textContent = s.simulate ? "SIMULATED EEG" : "";
  drawTrace(s.trace);
  $("chips").innerHTML = s.quality.map(q => `<div class="chip ${q.q.replace(' ','')}" title="1-40 Hz signal ${q.std_uv} µV, 60 Hz hum ${q.hum_pct}%"><b>${q.name}</b>${q.q} · ${q.std_uv}µV${q.hum_pct >= 20 ? ' · hum ' + q.hum_pct + '%' : ''}</div>`).join("");
  const f = s.features || {};
  const bars = ["alpha", "beta", "theta", "focus", "calm"];
  $("bars").innerHTML = bars.map(k => {
    const v = f[k]; const w = v === undefined ? 0 : Math.max(0, Math.min(100, (v + 1) * 25));
    return `<span>${k}</span><div class="bar"><i style="width:${w}%"></i></div>`;
  }).join("");
  recording = !!s.recording;
  $("big").textContent = recording ? "Stop recording" : "Start recording";
  $("big").className = recording ? "rec" : "";
  if (s.recording) {
    $("timer").textContent = fmt(s.recording.elapsed_s);
    $("recinfo").textContent = `${s.recording.folder} · ${s.recording.eeg_samples} EEG · ` +
      (s.recording.audio ? `audio ${Math.round(s.recording.audio_peak * 100)}% · ` : "no audio · ") +
      `${s.recording.midi_messages} MIDI · ${s.recording.markers} marks`;
  } else {
    $("recinfo").textContent = "not recording";
  }
  if (s.cc) {
    $("ccport").textContent = `→ ${s.cc.port} · ch ${s.cc.channel}`;
    if (document.activeElement !== $("ccon")) $("ccon").checked = s.cc.enabled;
    if (document.activeElement !== $("notes")) $("notes").checked = s.cc.notes;
    $("ccerr").textContent = s.cc.error || "";
    $("ccrows").innerHTML = s.cc.map.map(r => {
      const v = r.value ?? 0, learning = s.cc.learning === r.feature;
      return `<div class="ccrow"><span>${r.feature}</span><span class="dim">CC ${r.cc}</span>` +
        `<div class="bar"><i style="width:${v / 127 * 100}%"></i></div>` +
        `<button class="small ${learning ? "learning" : ""}" data-learn="${r.feature}">${learning ? "sending…" : "Learn"}</button></div>`;
    }).join("");
  } else {
    $("ccpanel").style.display = "none";
  }
  if (s.last_summary) {
    const L = s.last_summary;
    $("summary").textContent = `${L.folder}\n${L.duration_s}s · EEG ${L.eeg.samples} samples (${L.eeg.effective_rate} Hz, gaps ${L.eeg.gap_seconds}s)\n` +
      `audio: ${L.audio ? L.audio.seconds + "s from " + L.audio.device : "none"} · MIDI: ${L.midi ? L.midi.messages : 0} · markers: ${L.markers}`;
  }
}

async function toggle() {
  if (busy) return; busy = true;
  try {
    if (!recording) {
      const midi = [...document.querySelectorAll("#midi input:checked")].map(x => x.value);
      const r = await api("/start", { label: $("label").value, audio_device: $("audio").value, midi_ports: midi });
      $("warns").innerHTML = (r.warnings || []).map(w => `<div class="warn">⚠ ${w}</div>`).join("") + (r.error ? `<div class="warn">${r.error}</div>` : "");
    } else {
      await api("/stop", {});
    }
    await tick();
  } finally { busy = false; }
}

async function mark() {
  const r = await api("/mark", { text: $("marktext").value });
  if (r.ok) { $("marktext").value = ""; $("markbtn").textContent = "Marked ✓"; setTimeout(() => $("markbtn").textContent = "Mark", 800); }
}

$("big").onclick = toggle;
$("markbtn").onclick = mark;
$("ccon").onchange = async (e) => { const r = await api("/cc", { enabled: e.target.checked }); if (!r.ok) { e.target.checked = false; $("ccerr").textContent = r.error; } };
$("notes").onchange = (e) => api("/cc", { notes: e.target.checked });
$("ccrows").addEventListener("click", async (e) => {
  const f = e.target.dataset && e.target.dataset.learn;
  if (f) { const r = await api("/cc/learn", { feature: f }); if (!r.ok) $("ccerr").textContent = r.error; }
});
$("reveal").onclick = () => api("/reveal", {});
document.addEventListener("keydown", (e) => {
  const typing = ["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName);
  if (e.key === "Enter" && document.activeElement === $("marktext")) { e.preventDefault(); mark(); return; }
  if (typing) return;
  if (e.code === "Space") { e.preventDefault(); toggle(); }
  if (e.key === "m" || e.key === "M") { e.preventDefault(); mark(); }
});
loadDevices();
tick();
setInterval(tick, 250);
</script>
</body>
</html>
